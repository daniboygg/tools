<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --color-bg: #0d1117;
      --color-surface: #161b22;
      --color-header: #21262d;
      --color-border: #30363d;
      --color-text: #e6edf3;
      --color-muted: #8b949e;
      --color-primary: #58a6ff;

      --spacing-small: 8px;
      --spacing-medium: 16px;

      --radius: 8px;
      --font-size-small: 13px;
      --font-size-medium: 15px;
      --cell-max-width: 20em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: var(--font-size-medium);
      background: var(--color-bg);
      color: var(--color-text);
      padding: var(--spacing-medium);
      line-height: 1.4;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-medium);
      margin-bottom: var(--spacing-medium);
    }

    .open {
      color: var(--color-primary);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #fileInput {
      display: none !important;
    }

    .info {
      color: var(--color-muted);
      font-size: var(--font-size-small);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-wrap {
      overflow: auto;
      max-height: calc(100dvh - 90px);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: var(--font-size-small);
      min-width: 100%;
    }

    th,
    td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: top;
      max-width: var(--cell-max-width);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--color-header);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .date {
      white-space: nowrap;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .more {
      display: block;
      margin: var(--spacing-small) auto 0;
      padding: 10px var(--spacing-medium);
      font: inherit;
      color: var(--color-primary);
      background: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    body.dragging .table-wrap,
    body.dragging .empty {
      outline: 2px dashed var(--color-primary);
    }

    .empty {
      display: block;
      padding: 64px var(--spacing-medium);
      font-size: 17px;
      text-align: center;
      color: var(--color-muted);
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    /* Phones: when the table is wider than the screen, each row becomes a card
       listing every column name with its value. */
    .cards .table-wrap {
      max-height: none;
      overflow: visible;
      background: none;
      border: none;
    }

    .cards table,
    .cards tbody {
      display: block;
    }

    .cards thead {
      display: none;
    }

    .cards tr {
      display: block;
      margin-bottom: var(--spacing-medium);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }

    /* Each field: column name in small text above its value, with a line
       between fields so long values stay readable. */
    .cards td {
      display: block;
      max-width: none;
      padding: var(--spacing-small) 12px;
      border: none;
      font-size: var(--font-size-medium);
      text-align: left;
      white-space: pre-wrap;
    }

    .cards td:not(:empty) ~ td:not(:empty) {
      border-top: 1px solid var(--color-border);
    }

    .cards td::before {
      content: attr(data-label);
      display: block;
      margin-bottom: 2px;
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .cards td:empty {
      display: none;
    }
  </style>
</head>
<body>
  <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv,text/plain">

  <div class="bar hidden" id="bar">
    <span class="info" id="info"></span>
    <label class="open" for="fileInput">Open another file</label>
  </div>

  <label class="empty" id="empty" for="fileInput">Choose a CSV file or drop it here</label>

  <div class="table-wrap hidden" id="tableWrap">
    <table id="table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <button class="more hidden" id="moreBtn" type="button">Show more</button>

  <script>
    const $ = (id) => document.getElementById(id);
    const PAGE = 200;
    const DELIMITERS = [',', ';', '\t', '|'];
    const NULLS = new Set(['', 'na', 'n/a', 'null', '-']);

    let data = null;
    let order = [];
    let shown = 0;
    let sortCol = -1;
    let sortDir = 1;

    // Tries UTF-8 first; Spanish Excel and bank exports are often Windows-1252.
    function decode(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes[0] === 0xff && bytes[1] === 0xfe) {
        return new TextDecoder('utf-16le').decode(bytes);
      }
      if (bytes[0] === 0xfe && bytes[1] === 0xff) {
        return new TextDecoder('utf-16be').decode(bytes);
      }
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch {
        return new TextDecoder('windows-1252').decode(bytes);
      }
    }

    // Handles quoted fields, "" escapes, newlines inside quotes and any line ending.
    function parseCsv(text, delim, maxRows = Infinity) {
      const rows = [];
      const n = text.length;
      let row = [];
      let i = 0;
      while (i < n) {
        let field = '';
        if (text[i] === '"') {
          let j = i + 1;
          while (true) {
            const k = text.indexOf('"', j);
            if (k === -1) {
              field += text.slice(j);
              i = n;
              break;
            }
            field += text.slice(j, k);
            if (text[k + 1] === '"') {
              field += '"';
              j = k + 2;
            } else {
              i = k + 1;
              break;
            }
          }
        }
        let j = i;
        while (j < n && text[j] !== delim && text[j] !== '\n' && text[j] !== '\r') j++;
        field += text.slice(i, j);
        i = j;
        row.push(field);
        if (text[i] === delim) {
          i++;
          if (i === n) row.push('');
          continue;
        }
        rows.push(row);
        row = [];
        if (text[i] === '\r' && text[i + 1] === '\n') i++;
        i++;
        if (rows.length >= maxRows) return rows;
      }
      if (row.length) rows.push(row);
      return rows;
    }

    function mostCommon(values) {
      const counts = new Map();
      for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
      let best = 0;
      let bestCount = 0;
      for (const [v, c] of counts) {
        if (c > bestCount) {
          best = v;
          bestCount = c;
        }
      }
      return { value: best, share: values.length ? bestCount / values.length : 0 };
    }

    // The separator that gives the most rows with the same number of columns wins.
    function detectDelimiter(sample) {
      let best = ',';
      let bestScore = -1;
      for (const delim of DELIMITERS) {
        const rows = parseCsv(sample, delim, 100);
        if (rows.length > 1) rows.pop(); // may be cut off by the sample
        const counts = rows.map((r) => r.length);
        const { value, share } = mostCommon(counts);
        if (value < 2) continue;
        const score = Math.round(share * 100) * 1000 + value;
        if (score > bestScore) {
          best = delim;
          bestScore = score;
        }
      }
      return best;
    }

    const isNull = (v) => v === undefined || NULLS.has(v.trim().toLowerCase());

    // Reads 1,234.56, 1.234,56, 1 234,56, €12, 15%, (12.50) and 12.50-.
    function parseNumber(raw, decimal) {
      let s = raw.trim().replace(/[\s\u00a0\u202f'€$£%]/g, '');
      let sign = 1;
      if (/^\(.*\)$/.test(s) || /\d-$/.test(s)) {
        sign = -1;
        s = s.replace(/^\(|\)$|-$/g, '');
      }
      const pattern = decimal === ','
        ? /^[+-]?(\d{1,3}(\.\d{3})+|\d*)(,\d+)?$/
        : /^[+-]?(\d{1,3}(,\d{3})+|\d*)(\.\d+)?([eE][+-]?\d+)?$/;
      if (!/\d/.test(s) || !pattern.test(s)) return null;
      s = decimal === ',' ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      return sign * Number(s);
    }

    function detectDecimal(rows, delim) {
      let comma = delim === ';' ? 1 : 0;
      let dot = 0;
      for (const row of rows.slice(0, 1000)) {
        for (const v of row) {
          if (/\d\.\d{3},\d|^[+-]?\d+,\d{1,2}$/.test(v.trim())) comma++;
          if (/\d,\d{3}\.\d|^[+-]?\d+\.\d{1,2}$/.test(v.trim())) dot++;
        }
      }
      return comma > dot ? ',' : '.';
    }

    // Returns a sortable number for yyyy-mm-dd or dd/mm/yyyy (mm/dd if dayFirst is false).
    function parseDate(raw, dayFirst) {
      const s = raw.trim();
      let m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s);
      let y;
      let mo;
      let d;
      if (m) {
        [y, mo, d] = [+m[1], +m[2], +m[3]];
      } else {
        m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4}|\d{2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s);
        if (!m) return null;
        y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
        [d, mo] = dayFirst ? [+m[1], +m[2]] : [+m[2], +m[1]];
      }
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return (((y * 100 + mo) * 100 + d) * 100 + (+m[4] || 0)) * 100 + (+m[5] || 0);
    }

    // Day first unless some value can only be month/day, like 03/25/2026.
    function detectDayFirst(rows) {
      for (const row of rows.slice(0, 1000)) {
        for (const v of row) {
          const m = /^(\d{1,2})[/.-](\d{1,2})[/.-]\d{2,4}/.exec(v.trim());
          if (m && +m[1] > 12) return true;
          if (m && +m[2] > 12) return false;
        }
      }
      return true;
    }

    function columnType(rows, c, decimal, dayFirst) {
      let seen = 0;
      let numbers = 0;
      let dates = 0;
      for (const row of rows.slice(0, 2000)) {
        if (isNull(row[c])) continue;
        seen++;
        if (parseNumber(row[c], decimal) !== null) numbers++;
        else if (parseDate(row[c], dayFirst) !== null) dates++;
      }
      if (seen && numbers === seen) return 'number';
      if (seen && dates === seen) return 'date';
      return 'text';
    }

    function load(buffer, fileName) {
      let text = decode(buffer).replace(/^\ufeff/, '');
      let delim = null;
      const hint = /^sep=(.)\r?\n/i.exec(text);
      if (hint) {
        delim = hint[1];
        text = text.slice(hint[0].length);
      }
      delim = delim || detectDelimiter(text.slice(0, 100000));
      let rows = parseCsv(text, delim).filter((r) => r.some((v) => v.trim()));

      // Skip title lines before the table, like a bank name or account number.
      const width = mostCommon(rows.slice(0, 300).map((r) => r.length)).value;
      const start = rows.findIndex((r) => r.length === width);
      rows = rows.slice(Math.max(start, 0));

      const decimal = detectDecimal(rows, delim);
      const dayFirst = detectDayFirst(rows);
      const columns = Math.max(...rows.map((r) => r.length));

      // No header when the first row looks like data in a number or date column.
      const typesWithoutFirst = [];
      for (let c = 0; c < columns; c++) {
        typesWithoutFirst.push(columnType(rows.slice(1), c, decimal, dayFirst));
      }
      const hasHeader = rows.length < 2 || !rows[0].some((v, c) => !isNull(v) && (
        (typesWithoutFirst[c] === 'number' && parseNumber(v, decimal) !== null) ||
        (typesWithoutFirst[c] === 'date' && parseDate(v, dayFirst) !== null)));
      const body = hasHeader ? rows.slice(1) : rows;
      const names = [];
      for (let c = 0; c < columns; c++) {
        names.push((hasHeader && rows[0][c] || '').trim() || `Column ${c + 1}`);
      }
      const types = hasHeader ? typesWithoutFirst
        : names.map((_, c) => columnType(body, c, decimal, dayFirst));

      data = { names, types, body, decimal, dayFirst };
      sortCol = -1;
      order = body.map((_, i) => i);
      $('info').textContent = `${fileName} · ${body.length.toLocaleString()} rows`;
      $('empty').classList.add('hidden');
      $('bar').classList.remove('hidden');
      $('tableWrap').classList.remove('hidden');
      renderHead();
      renderRows(true);
    }

    function renderHead() {
      const tr = document.createElement('tr');
      data.names.forEach((name, c) => {
        const th = document.createElement('th');
        if (data.types[c] === 'number') th.className = 'num';
        th.textContent = name + (sortCol === c ? (sortDir > 0 ? ' ▲' : ' ▼') : '');
        th.addEventListener('click', () => sortBy(c));
        tr.append(th);
      });
      $('table').tHead.replaceChildren(tr);
    }

    function renderRows(reset) {
      if (reset) {
        shown = 0;
        $('table').tBodies[0].replaceChildren();
        $('tableWrap').scrollTop = 0;
      }
      const frag = document.createDocumentFragment();
      for (const i of order.slice(shown, shown + PAGE)) {
        const tr = document.createElement('tr');
        data.names.forEach((_, c) => {
          const td = document.createElement('td');
          td.className = { number: 'num', date: 'date', text: '' }[data.types[c]];
          td.dataset.label = data.names[c];
          td.textContent = data.body[i][c] ?? '';
          tr.append(td);
        });
        frag.append(tr);
      }
      $('table').tBodies[0].append(frag);
      shown = Math.min(shown + PAGE, order.length);
      const left = order.length - shown;
      $('moreBtn').textContent = `Show more (${left.toLocaleString()} left)`;
      $('moreBtn').classList.toggle('hidden', left === 0);
      fitLayout();
    }

    // Cards only on narrow screens, and only when the table does not fit.
    function fitLayout() {
      if (!data) return;
      document.body.classList.remove('cards');
      const wrap = $('tableWrap');
      const tooWide = wrap.scrollWidth > wrap.clientWidth + 1;
      document.body.classList.toggle('cards', tooWide && window.innerWidth <= 700);
    }

    // Tap a header to sort ascending, again for descending, a third time to reset.
    function sortBy(c) {
      if (sortCol !== c) {
        sortCol = c;
        sortDir = 1;
      } else if (sortDir === 1) {
        sortDir = -1;
      } else {
        sortCol = -1;
      }
      order = data.body.map((_, i) => i);
      if (sortCol >= 0) {
        const type = data.types[c];
        const key = (v) => {
          if (isNull(v)) return null;
          if (type === 'number') return parseNumber(v, data.decimal);
          if (type === 'date') return parseDate(v, data.dayFirst);
          return v;
        };
        const keys = data.body.map((row) => key(row[c]));
        const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
        order.sort((a, b) => {
          const ka = keys[a];
          const kb = keys[b];
          if (ka === null || kb === null) return (ka === null) - (kb === null) || a - b;
          const cmp = type === 'text' ? collator.compare(ka, kb) : ka - kb;
          return cmp * sortDir || a - b;
        });
      }
      renderHead();
      renderRows(true);
    }

    async function openFile(file) {
      if (file) load(await file.arrayBuffer(), file.name);
    }

    $('fileInput').addEventListener('change', (e) => {
      openFile(e.target.files[0]);
      e.target.value = '';
    });
    $('moreBtn').addEventListener('click', () => renderRows(false));
    window.addEventListener('resize', fitLayout);

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragleave', (e) => {
      if (!e.relatedTarget) document.body.classList.remove('dragging');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      document.body.classList.remove('dragging');
      openFile(e.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
